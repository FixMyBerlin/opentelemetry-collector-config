services:
  opentelemetry-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: opentelemetry-collector
    restart: unless-stopped

    # Eigene Logs nicht im json-file-Format schreiben, sonst liest file_log/docker
    # die Fehlermeldungen des Collectors wieder ein (Rückkopplung).
    # `docker logs` funktioniert mit dem local-Treiber weiterhin.
    logging:
      driver: local

    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

    # Wichtig: damit Prozesse/Host-Kontext sauber gelesen werden kann
    pid: "host"

    ports:
      # Standardmäßig nur lokal erreichbar. Für Zugriff von außen in der .env
      # OTEL_BIND_ADDRESS=0.0.0.0 setzen.
      - "${OTEL_BIND_ADDRESS:-127.0.0.1}:4317:4317"
      - "${OTEL_BIND_ADDRESS:-127.0.0.1}:4318:4318"

    # Serverspezifische Werte (Instance-ID, Token) – siehe .env.example
    env_file:
      - .env

    volumes:
      # Collector config
      - ./config.yaml:/etc/otelcol-contrib/config.yaml:ro

      # Docker json-file logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

      # Host-Views für host_metrics
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /:/hostfs:ro

      # Optional: Host identification
      - /etc/hostname:/etc/hostname:ro
      - /etc/machine-id:/etc/machine-id:ro
