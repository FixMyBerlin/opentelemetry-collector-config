receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# host_metrics Docs: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/hostmetricsreceiver
  host_metrics:
    collection_interval: 10s
    # Wichtig im Container: Host-/proc verwenden
    root_path: /hostfs
    scrapers:
      cpu: {}

      memory:
        metrics:
          system.memory.utilization:
            enabled: true
          # optional, falls du zusätzlich Bytes willst:
          system.memory.usage:
             enabled: true

      filesystem:
        metrics:
          # "free disk %" gibt es als utilization: Anteil belegt/frei je nach Semantik
          # (OTel nutzt utilization als Verhältnis 0..1)
          system.filesystem.utilization:
            enabled: true

  # Docker logs aus json-file (Host-Pfad ist in den Container gemountet)
  file_log/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    poll_interval: 200ms

    # Bei vollem Exporter langsamer lesen statt Logs zu verwerfen
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

    # wichtig, damit der Pfad als attributes["log.file.path"] verfügbar ist
    include_file_path: true

    operators:
    # Container Parser Docs: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/pkg/stanza/docs/operators/container.md
      - id: container_parser
        type: container
        format: docker
        add_metadata_from_filepath: false

        severity:
          parse_from: attributes.stream
          mapping:
            info: stdout
            error: stderr
          overwrite_text: true

      - id: containerid_from_path
        type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '^/var/lib/docker/containers/(?P<container_id>[0-9a-f]{64})/.*-json\.log$'

      - id: move_container_id_to_resource
        type: move
        from: attributes.container_id
        to: resource["container.id"]

processors:
  # Schützt den Host, falls sich bei einem Ausfall des Backends Daten stauen
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Bündelt Daten zu wenigen großen Requests statt vieler kleiner
  batch:
    send_batch_size: 2048
    send_batch_max_size: 4096
    timeout: 5s

  resource:
    attributes:
      - key: service.instance.id
        value: ${env:OTEL_SERVICE_INSTANCE_ID}
        action: upsert

exporters:
  otlp_http:
    endpoint: "https://monitoring.fixmycity.de/otlp"
    encoding: json
    headers:
      "Content-Type": "application/json"
      # TODO Enter Ingest Secret
      # OneUptime Token is project based!
      "x-oneuptime-token": ${env:ONEUPTIME_TOKEN}
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 15m
    sending_queue:
      enabled: true
      num_consumers: 4
      # Anzahl Batches – reicht dank batch-Processor für einige Minuten Ausfall
      queue_size: 5000

service:
  telemetry:
    logs:
      level: warn
      # Keine mehrzeiligen Stacktraces in den Collector-Logs
      disable_stacktrace: true
    resource:
      # Feste ID für die eigene Telemetrie des Collectors (Logs, interne Metriken)
      service.instance.id: ${env:OTEL_SERVICE_INSTANCE_ID}

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http]
    metrics:
      receivers: [otlp, host_metrics]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http]
    logs:
      receivers: [otlp, file_log/docker]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http]
